name: Deploy GitHub Pages mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate canonical benchmark results
        run: |
          python benchmark-data/standard/ucr-uea/scripts/build_results.py --no-release-wide
          python benchmark-data/low-shot/ucr-uea/scripts/build_results.py
          git diff --exit-code -- benchmark-data/standard/ucr-uea/generated benchmark-data/low-shot/ucr-uea/generated

      - name: Build static mirror
        run: pnpm run build:pages
        env:
          NEXT_PUBLIC_PRIMARY_SITE_URL: https://tsc-fm-benchmark.vercel.app

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
