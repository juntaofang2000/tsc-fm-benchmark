name: Sync Hugging Face entry points

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hf-space/**"
      - "hf-organization-card/**"
      - ".github/workflows/sync-huggingface.yml"

permissions:
  contents: read

jobs:
  sync-space:
    if: ${{ vars.HF_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Hugging Face publishing secret
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN is empty. Store the token value (not its Hugging Face display name) as a repository Actions secret named HF_TOKEN; an Actions variable is not sufficient."
            exit 1
          fi
      - uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: TSC-FM/benchmark
          repo_type: space
          space_sdk: static
          subdirectory: hf-space
          hf_token: ${{ secrets.HF_TOKEN }}

  sync-organization-card:
    if: ${{ vars.HF_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Hugging Face publishing secret
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN is empty. Store the token value (not its Hugging Face display name) as a repository Actions secret named HF_TOKEN; an Actions variable is not sufficient."
            exit 1
          fi
      - uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: TSC-FM/README
          repo_type: space
          space_sdk: static
          subdirectory: hf-organization-card
          hf_token: ${{ secrets.HF_TOKEN }}

